name: Format check on pull request

on: pull_request

concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-linter
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dotnet-format:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      # The SDK's built-in `dotnet format` is used rather than the legacy
      # standalone dotnet-format tool, which cannot discover a .slnx solution.
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10

      - name: lint
        run: |
          dotnet format

      - name: status
        run: |
          git status

      - name: Check for modified files
        run: |
          if (git status | Select-String -Pattern 'modified') {
            Write-Host "Modified files found. Please run dotnet format and commit the changes."
            exit 1
          } else {
            Write-Host "No modified files found."
          }
